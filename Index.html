<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebAR Single Target</title>
    <!-- A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: sans-serif;
      }
      #startBtn {
        padding: 14px 28px;
        font-size: 18px;
        font-weight: bold;
        background-color: #00adb5;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 15px;
      }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <!-- Tap to Start -->
    <div id="overlay">
      <h2>AR Ready</h2>
      <p>Tap below to start camera & audio</p>
      <button id="startBtn">START</button>
    </div>

    <a-scene
      mindar-image="imageTargetSrc: ./targets.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-assets>
        <video
          id="vid"
          src="video.mp4"
          preload="auto"
          loop
          crossorigin="anonymous"
          playsinline
          webkit-playsinline
        ></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Single Target (Index 0) -->
      <a-entity id="target" mindar-image-target="targetIndex: 0">
        <a-video id="arVideo" src="#vid" position="0 0 0" width="1" height="1"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const startBtn = document.querySelector("#startBtn");
      const overlay = document.querySelector("#overlay");
      const vid = document.querySelector("#vid");
      const arVideo = document.querySelector("#arVideo");
      const target = document.querySelector("#target");

      // Auto adjust height to avoid video stretch/shrink
      function adjustRatio() {
        if (vid.videoWidth && vid.videoHeight) {
          const ratio = vid.videoHeight / vid.videoWidth;
          arVideo.setAttribute("width", "1");
          arVideo.setAttribute("height", ratio.toString());
        }
      }

      vid.addEventListener("loadedmetadata", adjustRatio);

      startBtn.addEventListener("click", () => {
        overlay.style.display = "none";
        vid.play().then(() => vid.pause());
        adjustRatio();
      });

      target.addEventListener("targetFound", () => {
        vid.play();
      });

      target.addEventListener("targetLost", () => {
        vid.pause();
      });
    </script>
  </body>
</html>
